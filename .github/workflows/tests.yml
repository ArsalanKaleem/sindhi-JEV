name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4   # labeller JS <-> Python parity test
        with:
          node-version: "20"
      - name: Install CPU-only dependencies (pinned as in requirements.lock.txt)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.5.5 opencv-python-headless==5.0.0.93 pillow==13.0.0 fonttools==4.68.0 \
                      uharfbuzz==0.57.0 freetype-py==2.5.1 scikit-learn==1.9.1 pytest==9.2.0
      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
